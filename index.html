
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Match Made in Art</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #ffcce1;
      --coral: #e66268;
      --charcoal: #2d2d2d;
      --cream: #fff3eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--pink);
      color: var(--charcoal);
      font-family: 'DM Sans', sans-serif;
    }

    button {
      font-family: inherit;
    }

    .quiz-container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
    }

    .quiz-card {
      background: var(--cream);
      border: 3px solid var(--charcoal);
      border-radius: 22px;
      padding: 34px 30px;
      box-shadow: 7px 7px 0 var(--charcoal);
      text-align: center;
    }

    .hearts {
      color: var(--coral);
      font-size: 22px;
      letter-spacing: 7px;
      margin-bottom: 15px;
    }

    h1, h2, h3 {
      font-family: 'Fredoka', sans-serif;
      color: var(--charcoal);
    }

    h1 {
      font-size: clamp(32px, 6vw, 48px);
      line-height: 1.1;
      margin: 8px 0 14px;
    }

    h2 {
      font-size: clamp(23px, 4vw, 30px);
      line-height: 1.25;
      margin: 12px 0 24px;
    }

    p {
      line-height: 1.65;
    }

    .intro {
      max-width: 470px;
      margin: 0 auto 25px;
      font-size: 16px;
    }

    .button {
      display: inline-block;
      border: 2px solid var(--charcoal);
      border-radius: 999px;
      background: var(--coral);
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 13px 30px;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--charcoal);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .button:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--charcoal);
    }

    .button:focus-visible,
    .answer:focus-visible {
      outline: 3px solid var(--charcoal);
      outline-offset: 4px;
    }

    .progress {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin: 0 0 25px;
    }

    .progress-heart {
      color: #e7b8c9;
      font-size: 22px;
    }

    .progress-heart.active {
      color: var(--coral);
    }

    .question-number {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--coral);
      margin-bottom: 7px;
    }

    .answers {
      display: grid;
      gap: 12px;
      margin: 0 auto 25px;
      text-align: left;
    }

    .answer {
      width: 100%;
      padding: 15px 18px;
      border: 2px solid var(--charcoal);
      border-radius: 13px;
      background: white;
      color: var(--charcoal);
      font-size: 15px;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .answer:hover {
      background: var(--pink);
      transform: translateY(-2px);
    }

    .answer.selected {
      background: var(--pink);
      border-color: var(--coral);
      box-shadow: inset 0 0 0 1px var(--coral);
    }

    .answer.selected::before {
      content: "♥ ";
      color: var(--coral);
      font-weight: 700;
    }

    .next-button {
      min-width: 180px;
    }

    .next-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: 3px 3px 0 var(--charcoal);
    }

    .result-icon {
      font-size: 48px;
      margin: 5px 0 10px;
    }

    .result-name {
      font-size: clamp(29px, 5vw, 39px);
      margin: 8px 0 14px;
    }

    .result-description {
      max-width: 460px;
      margin: 0 auto 25px;
      font-size: 16px;
    }

    .shop-button {
      text-decoration: none;
      margin-bottom: 20px;
    }

    .restart-button {
      display: block;
      margin: 18px auto 0;
      background: transparent;
      color: var(--charcoal);
      border: none;
      font-size: 14px;
      text-decoration: underline;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px 12px;
      }

      .quiz-card {
        padding: 27px 19px;
        border-radius: 18px;
        box-shadow: 5px 5px 0 var(--charcoal);
      }

      .answer {
        padding: 14px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="quiz-container">
    <section class="quiz-card">

      <!-- INTRODUCTION -->
      <div id="welcome">
        <div class="hearts">♥ ♥ ♥</div>
        <h1>A Match Made in Art</h1>
        <p class="intro">
          Not sure where to start? Answer 6 questions and find the art collection that matches your personality!
        </p>
        <button class="button" onclick="startQuiz()">Find my match</button>
      </div>

      <!-- QUESTIONS -->
      <div id="quiz" class="hidden">
        <div class="progress" id="progress"></div>
        <div class="question-number" id="questionNumber"></div>
        <h2 id="questionText"></h2>
        <div class="answers" id="answers"></div>
        <button class="button next-button" id="nextButton" onclick="nextQuestion()" disabled>
          Next question
        </button>
      </div>

      <!-- RESULTS -->
      <div id="result" class="hidden">
        <div class="hearts">♥ ♥ ♥</div>
        <div class="result-icon" id="resultIcon"></div>
        <h2 class="result-name" id="resultName"></h2>
        <p class="result-description" id="resultDescription"></p>
        <a class="button shop-button" id="shopLink" href="#" target="_blank" rel="noopener">
          Explore your collection
        </a>
        <button class="restart-button" onclick="restartQuiz()">
          Take the quiz again
        </button>
      </div>

    </section>
  </main>

  <script>
    // COLLECTIONS

    const collections = {
      winter: {
        name: "A Little Winter Magic",
        icon: "❄️",
        description: "You're a cosy soul who loves life's little comforts. You appreciate warm moments, seasonal magic and artwork that makes a space feel like home.",
        link: "https://wowanothershop.com/collections/a-little-winter-magic"
      },

      summer: {
        name: "The Summer Club",
        icon: "☀️",
        description: "You're sunshine in human form! Playful, colourful and full of life, you like to have fun and prefer artwork that feels positive and warm.",
        link: "https://wowanothershop.com/collections/the-summer-club"
      },

      classics: {
        name: "The Classics",
        icon: "💋",
        description: "You have an eye for timeless style. A little glamour, a touch of elegance and a love for the things that never go out of fashion.",
        link: "https://wowanothershop.com/collections/the-classics"
      },

      wild: {
        name: "Wild at Heart",
        icon: "🤠",
        description: "You have an adventurous spirit and like to do things your own way. You have a rebellious streak and a soft spot for a little wild-west charm.",
        link: "https://wowanothershop.com/collections/wild-at-heart"
      },

      spooky: {
        name: "Spooky Art Lover",
        icon: "🕷️",
        description: "You find comfort in the darker things and you're not afraid to show it. Halloween is like Christmas for you. You like a little mystery, a little mischief and love all things spooky.",
        link: "https://wowanothershop.com/collections/spooky-art-lover"
      },

      mystical: {
        name: "Mystical Muses",
        icon: "🌙",
        description: "You're imaginative, curious and drawn to a little magic. You've blamed the moon for your problems at least once and love a touch of otherworldly charm.",
        link: "https://wowanothershop.com/collections/mystical-muses"
      }
    };


    // SECONDARY COLLECTION POINTS
    // Each answer gives 2 points to its main collection
    // and 1 point to its secondary collection.

    const secondaryMatches = {
      winter: "mystical",
      summer: "wild",
      classics: "mystical",
      wild: "summer",
      spooky: "mystical",
      mystical: "spooky"
    };


    // QUIZ QUESTIONS

    const questions = [

      {
        question: "Which description best describes your wardrobe?",
        answers: [
          {
            text: "Layers, oversized jumpers, knitwear and cosy outfits.",
            collection: "winter"
          },
          {
            text: "All my clothes are different shades of black.",
            collection: "spooky"
          },
          {
            text: "Colourful, playful and bold.",
            collection: "summer"
          }
        ]
      },

      {
        question: "What drink suits you best?",
        answers: [
          {
            text: "A sweet cocktail!",
            collection: "summer"
          },
          {
            text: "A smooth whiskey.",
            collection: "classics"
          },
          {
            text: "A soothing hot drink.",
            collection: "winter"
          }
        ]
      },

      {
        question: "Which of these TV shows would you be most likely to binge-watch?",
        answers: [
          {
            text: "Charmed",
            collection: "mystical"
          },
          {
            text: "Yellowstone",
            collection: "wild"
          },
          {
            text: "American Horror Story",
            collection: "spooky"
          }
        ]
      },

      {
        question: "What's your ideal way to spend a day off?",
        answers: [
          {
            text: "At the beach, enjoying the sea and sunshine.",
            collection: "summer"
          },
          {
            text: "Curling up under a cosy blanket with a hot drink and your fave film.",
            collection: "winter"
          },
          {
            text: "Dressing up, going somewhere fancy and making an ordinary day feel special.",
            collection: "classics"
          }
        ]
      },

      {
        question: "Which of these animals do you like more?",
        answers: [
          {
            text: "Cats",
            collection: "mystical"
          },
          {
            text: "Horses",
            collection: "wild"
          },
          {
            text: "Crows",
            collection: "spooky"
          }
        ]
      },

      {
        question: "Your spouse has mysteriously disappeared. What's your statement to the police?",
        answers: [
          {
            text: "I haven't seen them all day.",
            collection: "classics"
          },
          {
            text: "Well, that's a relief.",
            collection: "classics"
          },
          {
            text: "I wouldn't go looking if I were you.",
            collection: "spooky"
          }
        ]
      }

    ];


    // QUIZ STATE

    let currentQuestion = 0;
    let selectedAnswer = null;
    let scores = {};


    function resetScores() {
      scores = {};

      Object.keys(collections).forEach(key => {
        scores[key] = 0;
      });
    }


    // START QUIZ

    function startQuiz() {
      currentQuestion = 0;
      selectedAnswer = null;
      resetScores();

      document.getElementById("welcome").classList.add("hidden");
      document.getElementById("result").classList.add("hidden");
      document.getElementById("quiz").classList.remove("hidden");

      showQuestion();
    }


    // DISPLAY QUESTION

    function showQuestion() {
      selectedAnswer = null;

      const question = questions[currentQuestion];

      document.getElementById("questionNumber").textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

      document.getElementById("questionText").textContent =
        question.question;

      document.getElementById("nextButton").disabled = true;

      document.getElementById("nextButton").textContent =
        currentQuestion === questions.length - 1
          ? "See my result"
          : "Next question";

      // Update progress hearts

      const progress = document.getElementById("progress");
      progress.innerHTML = "";

      for (let i = 0; i < questions.length; i++) {
        const heart = document.createElement("span");
        heart.className = "progress-heart" + (i <= currentQuestion ? " active" : "");
        heart.textContent = "♥";
        progress.appendChild(heart);
      }

      // Display answers

      const answersContainer = document.getElementById("answers");
      answersContainer.innerHTML = "";

      question.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.className = "answer";
        button.type = "button";
        button.textContent = answer.text;

        button.addEventListener("click", () => selectAnswer(index));

        answersContainer.appendChild(button);
      });
    }


    // SELECT ANSWER

    function selectAnswer(index) {
      selectedAnswer = index;

      const answerButtons = document.querySelectorAll(".answer");

      answerButtons.forEach((button, i) => {
        button.classList.toggle("selected", i === index);
      });

      document.getElementById("nextButton").disabled = false;
    }


    // NEXT QUESTION / CALCULATE SCORE

    function nextQuestion() {
      if (selectedAnswer === null) return;

      const answer = questions[currentQuestion].answers[selectedAnswer];

      // Main collection receives 2 points
      scores[answer.collection] += 2;

      // Secondary collection receives 1 point
      const secondary = secondaryMatches[answer.collection];
      scores[secondary] += 1;

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }


    // DISPLAY RESULT

    function showResult() {
      document.getElementById("quiz").classList.add("hidden");
      document.getElementById("result").classList.remove("hidden");

      // Find highest score.
      // In the event of a tie, collection order below decides the result.

      const collectionOrder = [
        "winter",
        "summer",
        "classics",
        "wild",
        "spooky",
        "mystical"
      ];

      let winningCollection = collectionOrder[0];

      collectionOrder.forEach(collection => {
        if (scores[collection] > scores[winningCollection]) {
          winningCollection = collection;
        }
      });

      const result = collections[winningCollection];

      document.getElementById("resultIcon").textContent = result.icon;
      document.getElementById("resultName").textContent = result.name;
      document.getElementById("resultDescription").textContent = result.description;
      document.getElementById("shopLink").href = result.link;
    }


    // RESTART QUIZ

    function restartQuiz() {
      currentQuestion = 0;
      selectedAnswer = null;
      resetScores();

      document.getElementById("result").classList.add("hidden");
      document.getElementById("welcome").classList.remove("hidden");
    }

  </script>

</body>
</html>
