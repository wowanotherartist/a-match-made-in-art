
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Match Made in Art</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #ffcce1;
      --coral: #e66268;
      --charcoal: #2d2d2d;
      --cream: #fff3eb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background-color: var(--pink) !important;
    }

    body {
      padding: 24px 16px;
      color: var(--charcoal);
      font-family: 'DM Sans', sans-serif;
    }

    .quiz-card {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding: 36px 32px;
      background-color: var(--pink);
      border: 2px solid var(--charcoal);
      border-radius: 22px;
      text-align: center;
      box-shadow: 5px 5px 0 var(--charcoal);
    }

    .hearts {
      margin-bottom: 12px;
      color: var(--coral);
      font-size: 25px;
      letter-spacing: 7px;
    }

    h1 {
      margin: 0 0 10px;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(30px, 6vw, 43px);
      line-height: 1.15;
      font-weight: 600;
    }

    .subtitle {
      max-width: 480px;
      margin: 0 auto 26px;
      font-size: 15px;
      line-height: 1.6;
    }

    .progress-area {
      margin-bottom: 25px;
    }

    .progress-label {
      margin-bottom: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .progress-hearts {
      display: flex;
      justify-content: center;
      gap: 9px;
      color: #ffffff;
      font-size: 23px;
    }

    .progress-hearts span {
      opacity: 0.45;
    }

    .progress-hearts span.filled {
      color: var(--coral);
      opacity: 1;
    }

    .question {
      margin: 0 0 20px;
      font-family: 'Fredoka', sans-serif;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.35;
    }

    .answers {
      display: grid;
      gap: 12px;
      margin-bottom: 24px;
    }

    .answer {
      display: block;
      width: 100%;
      padding: 15px 17px;
      background: #ffffff;
      border: 2px solid var(--charcoal);
      border-radius: 13px;
      color: var(--charcoal);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .answer:hover {
      transform: translateY(-2px);
      background: var(--cream);
    }

    .answer.selected {
      background: var(--coral);
      color: #ffffff;
      border-color: var(--charcoal);
    }

    .main-button {
      display: inline-block;
      width: 100%;
      max-width: 280px;
      padding: 14px 24px;
      background: var(--coral);
      border: 2px solid var(--charcoal);
      border-radius: 30px;
      color: #ffffff;
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--charcoal);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .main-button:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--charcoal);
    }

    .main-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: 3px 3px 0 var(--charcoal);
    }

    .result-heading {
      margin: 8px 0 12px;
      font-family: 'Fredoka', sans-serif;
      font-size: 30px;
      line-height: 1.2;
    }

    .result-description {
      margin: 0 auto 22px;
      max-width: 480px;
      font-size: 15px;
      line-height: 1.65;
    }

    .result-emoji {
      margin-bottom: 8px;
      font-size: 42px;
    }

    .collection-link {
      display: inline-block;
      width: 100%;
      max-width: 300px;
      margin-bottom: 20px;
      padding: 14px 22px;
      background: var(--coral);
      border: 2px solid var(--charcoal);
      border-radius: 30px;
      color: #ffffff;
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 3px 3px 0 var(--charcoal);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .collection-link:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--charcoal);
    }

    .restart-button {
      display: block;
      margin: 0 auto;
      padding: 9px 15px;
      background: transparent;
      border: none;
      color: var(--charcoal);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px 10px;
      }

      .quiz-card {
        padding: 27px 18px;
        border-radius: 18px;
      }

      .question {
        font-size: 21px;
      }

      .answer {
        padding: 13px 14px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <main class="quiz-card">

    <div class="hearts">♥ ♥ ♥</div>

    <h1>A Match Made in Art</h1>

    <p class="subtitle">
      Not sure where to start? Answer 6 questions and find the art collection that matches your personality!
    </p>

    <section id="quiz">

      <div class="progress-area">
        <div class="progress-label" id="progress-label">Question 1 of 6</div>
        <div class="progress-hearts" id="progress-hearts">
          <span class="filled">♥</span>
          <span>♥</span>
          <span>♥</span>
          <span>♥</span>
          <span>♥</span>
          <span>♥</span>
        </div>
      </div>

      <h2 class="question" id="question"></h2>

      <div class="answers" id="answers"></div>

      <button class="main-button" id="next-button" disabled>
        Next Question →
      </button>

    </section>

    <section id="result" class="hidden">

      <div class="result-emoji" id="result-emoji"></div>

      <h2 class="result-heading">
        Your perfect match is...
      </h2>

      <h2 class="result-heading" id="result-title"></h2>

      <p class="result-description" id="result-description"></p>

      <a class="collection-link" id="collection-link" href="#" target="_blank" rel="noopener noreferrer">
        Explore your collection →
      </a>

      <button class="restart-button" id="restart-button">
        ↻ Take the quiz again
      </button>

    </section>

  </main>

  <script>
    const collections = {
      winter: {
        name: "A Little Winter Magic",
        emoji: "❄️",
        description: "You love cosy comforts, little moments of magic and the charm of the colder months. Your perfect collection is full of warmth, whimsy and winter-inspired artwork.",
        url: "https://wowanothershop.com/collections/a-little-winter-magic"
      },

      summer: {
        name: "The Summer Club",
        emoji: "☀️",
        description: "You're playful, colourful and always ready for a little sunshine. You gravitate towards bright artwork, fun personalities and carefree summer energy.",
        url: "https://wowanothershop.com/collections/the-summer-club"
      },

      classics: {
        name: "The Classics",
        emoji: "💋",
        description: "You appreciate timeless glamour, elegance and a little vintage sophistication. You know that some things never go out of style.",
        url: "https://wowanothershop.com/collections/the-classics"
      },

      wild: {
        name: "Wild at Heart",
        emoji: "🤠",
        description: "Independent, adventurous and a little rebellious, you have a soft spot for free spirits and women who do things their own way.",
        url: "https://wowanothershop.com/collections/wild-at-heart"
      },

      spooky: {
        name: "Spooky Art Lover",
        emoji: "🖤",
        description: "You like your art with a darker side. From gothic glamour to horror-inspired mischief, you appreciate the strange, spooky and wonderfully macabre.",
        url: "https://wowanothershop.com/collections/spooky-art-lover"
      },

      mystical: {
        name: "Mystical Muses",
        emoji: "🌙",
        description: "You're drawn to all things magical, mysterious and otherworldly. You love a little celestial energy, a touch of witchcraft and artwork with an enchanting twist.",
        url: "https://wowanothershop.com/collections/mystical-muses"
      }
    };

    const secondaryMatches = {
      winter: "mystical",
      summer: "wild",
      classics: "mystical",
      wild: "summer",
      spooky: "mystical",
      mystical: "spooky"
    };

    const questions = [
      {
        question: "Which description best describes your wardrobe?",
        answers: [
          {
            text: "Layers, oversized jumpers, knitwear and cosy outfits.",
            collection: "winter"
          },
          {
            text: "All my clothes are different shades of black.",
            collection: "spooky"
          },
          {
            text: "Colourful, playful and bold.",
            collection: "summer"
          }
        ]
      },
      {
        question: "What drink suits you best?",
        answers: [
          {
            text: "A sweet cocktail!",
            collection: "summer"
          },
          {
            text: "A smooth whiskey.",
            collection: "classics"
          },
          {
            text: "A soothing hot drink.",
            collection: "winter"
          }
        ]
      },
      {
        question: "Which of these TV shows would you be most likely to binge-watch?",
        answers: [
          {
            text: "Charmed",
            collection: "mystical"
          },
          {
            text: "Yellowstone",
            collection: "wild"
          },
          {
            text: "American Horror Story",
            collection: "spooky"
          }
        ]
      },
      {
        question: "What's your ideal way to spend a day off?",
        answers: [
          {
            text: "At the beach, enjoying the sea and sunshine.",
            collection: "summer"
          },
          {
            text: "Curling up under a cosy blanket with a hot drink and your fave film.",
            collection: "winter"
          },
          {
            text: "Dressing up, going somewhere fancy and making an ordinary day feel special.",
            collection: "classics"
          }
        ]
      },
      {
        question: "Which of these animals do you like more?",
        answers: [
          {
            text: "Cats",
            collection: "mystical"
          },
          {
            text: "Horses",
            collection: "wild"
          },
          {
            text: "Crows",
            collection: "spooky"
          }
        ]
      },
      {
        question: "Your spouse has mysteriously disappeared. What's your statement to the police?",
        answers: [
          {
            text: "“I haven't seen them all day.”",
            collection: "classics"
          },
          {
            text: "“Well, that's a relief.”",
            collection: "classics"
          },
          {
            text: "“I wouldn't go looking if I were you.”",
            collection: "spooky"
          }
        ]
      }
    ];

    const tieOrder = [
      "winter",
      "summer",
      "classics",
      "wild",
      "spooky",
      "mystical"
    ];

    let currentQuestion = 0;
    let selectedAnswer = null;
    let scores = {};

    const questionElement = document.getElementById("question");
    const answersElement = document.getElementById("answers");
    const nextButton = document.getElementById("next-button");
    const progressLabel = document.getElementById("progress-label");
    const progressHearts = document.getElementById("progress-hearts");
    const quizSection = document.getElementById("quiz");
    const resultSection = document.getElementById("result");

    function resetScores() {
      scores = {
        winter: 0,
        summer: 0,
        classics: 0,
        wild: 0,
        spooky: 0,
        mystical: 0
      };
    }

    function updateProgress() {
      progressLabel.textContent =
        `Question ${currentQuestion + 1} of ${questions.length}`;

      const hearts = progressHearts.querySelectorAll("span");

      hearts.forEach((heart, index) => {
        heart.classList.toggle("filled", index <= currentQuestion);
      });
    }

    function showQuestion() {
      selectedAnswer = null;

      const question = questions[currentQuestion];

      questionElement.textContent = question.question;
      answersElement.innerHTML = "";

      question.answers.forEach((answer, index) => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "answer";
        button.textContent = answer.text;

        button.addEventListener("click", () => {
          selectAnswer(button, answer);
        });

        answersElement.appendChild(button);
      });

      nextButton.disabled = true;

      nextButton.textContent =
        currentQuestion === questions.length - 1
          ? "See my match →"
          : "Next Question →";

      updateProgress();
    }

    function selectAnswer(button, answer) {
      document.querySelectorAll(".answer").forEach(item => {
        item.classList.remove("selected");
      });

      button.classList.add("selected");

      selectedAnswer = answer;
      nextButton.disabled = false;
    }

    function recordAnswer() {
      scores[selectedAnswer.collection] += 2;

      const secondary = secondaryMatches[selectedAnswer.collection];

      if (secondary) {
        scores[secondary] += 1;
      }
    }

    function getWinningCollection() {
      let winner = tieOrder[0];

      tieOrder.forEach(collection => {
        if (scores[collection] > scores[winner]) {
          winner = collection;
        }
      });

      return winner;
    }

    function showResult() {
      const winner = getWinningCollection();
      const collection = collections[winner];

      quizSection.classList.add("hidden");
      resultSection.classList.remove("hidden");

      document.getElementById("result-emoji").textContent =
        collection.emoji;

      document.getElementById("result-title").textContent =
        collection.name;

      document.getElementById("result-description").textContent =
        collection.description;

      document.getElementById("collection-link").href =
        collection.url;
    }

    nextButton.addEventListener("click", () => {
      if (!selectedAnswer) return;

      recordAnswer();

      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        showQuestion();
      } else {
        showResult();
      }
    });

    document.getElementById("restart-button").addEventListener("click", () => {
      currentQuestion = 0;
      selectedAnswer = null;

      resetScores();

      resultSection.classList.add("hidden");
      quizSection.classList.remove("hidden");

      showQuestion();
    });

    resetScores();
    showQuestion();
  </script>

</body>
</html>
