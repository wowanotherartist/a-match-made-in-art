
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Match Made in Art</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&display=swap');

:root {
  --pink: #ffcce1;
  --light-pink: #fff3eb;
  --pale-pink: #fff3eb;
  --dark-pink: #e66268;
  --red: #e66268;
  --ink: #2d2d2d;
  --white: #fff3eb;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 35px 16px;
  min-height: 100vh;
  background: var(--pink);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.quiz {
  width: 100%;
  max-width: 620px;
  background: var(--pink);
  border: 3px solid var(--ink);
  border-radius: 22px;
  padding: 32px;
  box-shadow: 8px 8px 0 var(--ink);
  text-align: center;
}

.decor {
  color: var(--red);
  font-size: 25px;
  letter-spacing: 8px;
  margin-bottom: 8px;
}

h1 {
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(32px, 7vw, 46px);
  line-height: 1.1;
  margin: 0 0 12px;
}

.intro {
  font-size: 15px;
  line-height: 1.6;
  margin: 0 auto 25px;
  max-width: 420px;
}

.progress {
  display: flex;
  justify-content: center;
  gap: 13px;
  margin: 22px 0;
}

.heart {
  font-size: 23px;
  color: var(--light-pink);
  opacity: 1;
  transition: .2s;
}

.heart.active {
  color: var(--red);
}

.question-number {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 10px;
}

h2 {
  font-family: 'Fredoka', sans-serif;
  font-size: 25px;
  margin: 0 0 22px;
}

.answers {
  display: grid;
  gap: 12px;
}

.answer {
  width: 100%;
  padding: 17px 16px;
  background: var(--pale-pink);
  border: 2px solid var(--ink);
  border-radius: 13px;
  color: var(--ink);
  font: 600 15px 'DM Sans', sans-serif;
  cursor: pointer;
  transition: .15s;
}

.answer:hover {
  background: var(--light-pink);
  transform: translateY(-2px);
}

.answer.selected {
  background: var(--dark-pink);
  color: var(--white);
  border-color: var(--ink);
  box-shadow: 3px 3px 0 var(--ink);
}

.next {
  margin-top: 24px;
  padding: 14px 30px;
  background: var(--red);
  color: var(--white);
  border: 2px solid var(--ink);
  border-radius: 30px;
  font: 700 15px 'DM Sans', sans-serif;
  cursor: pointer;
  box-shadow: 3px 3px 0 var(--ink);
  transition: .15s;
}

.next:hover {
  transform: translateY(-2px);
}

.next:disabled {
  opacity: .4;
  cursor: not-allowed;
  transform: none;
}

.result-symbol {
  font-size: 52px;
  margin: 10px 0;
}

.result-label {
  color: var(--red);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.result-description {
  font-size: 16px;
  line-height: 1.7;
  max-width: 430px;
  margin: 12px auto 25px;
}

.shop-link {
  display: inline-block;
  padding: 15px 25px;
  background: var(--red);
  color: var(--white);
  border: 2px solid var(--ink);
  border-radius: 30px;
  text-decoration: none;
  font-weight: 800;
  font-size: 14px;
  box-shadow: 3px 3px 0 var(--ink);
  transition: .15s;
}

.shop-link:hover {
  transform: translateY(-2px);
}

.restart {
  display: block;
  margin: 22px auto 0;
  border: 0;
  background: transparent;
  color: var(--ink);
  text-decoration: underline;
  font: 600 13px 'DM Sans', sans-serif;
  cursor: pointer;
}

.hidden {
  display: none;
}

@media (max-width: 480px) {
  body {
    padding: 20px 13px;
  }

  .quiz {
    padding: 25px 18px;
  }

  h2 {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<main class="quiz">

  <!-- WELCOME SCREEN -->
  <section id="welcome">
    <div class="decor">♥ ♥ ♥</div>

    <h1>A Match Made in Art</h1>

    <p class="intro">
      Not sure where to start? Answer 5 questions and find the art collection that matches your personality!
    </p>

    <button class="next" onclick="startQuiz()">
      LET'S FIND YOUR MATCH ♥
    </button>
  </section>


  <!-- QUIZ QUESTIONS -->
  <section id="quiz-section" class="hidden">

    <div class="decor">♥ ♥ ♥</div>

    <div class="progress" id="progress"></div>

    <div class="question-number" id="question-number"></div>

    <h2 id="question"></h2>

    <div class="answers" id="answers"></div>

    <button
      class="next"
      id="next"
      disabled
      onclick="nextQuestion()">
      NEXT QUESTION →
    </button>

  </section>


  <!-- RESULTS SCREEN -->
  <section id="result" class="hidden">

    <div class="decor">♥ ♥ ♥</div>

    <div class="result-label">
      YOUR PERFECT MATCH IS...
    </div>

    <div class="result-symbol" id="result-symbol"></div>

    <h1 id="result-title"></h1>

    <p class="result-description" id="result-description"></p>

    <a
      class="shop-link"
      id="shop-link"
      href="#"
      target="_blank"
      rel="noopener noreferrer">
      SHOP MY COLLECTION ♥
    </a>

    <button class="restart" onclick="restartQuiz()">
      TAKE THE QUIZ AGAIN
    </button>

  </section>

</main>


<script>

// ========================================
// QUIZ QUESTIONS
// ========================================

const questions = [

  {
    question: "Which description best describes your wardrobe?",
    answers: [
      {
        text: "Layers, oversized jumpers, knitwear and cosy outfits.",
        score: ["winter"]
      },
      {
        text: "All my clothes are different shades of black.",
        score: ["spooky"]
      },
      {
        text: "Colourful, playful and bold.",
        score: ["summer"]
      }
    ]
  },

  {
    question: "What drink suits you best?",
    answers: [
      {
        text: "A sweet cocktail!",
        score: ["summer"]
      },
      {
        text: "A smooth whiskey.",
        score: ["classics"]
      },
      {
        text: "A soothing hot drink.",
        score: ["winter"]
      }
    ]
  },

  {
    question: "Which of these TV shows would you be most likely to binge-watch?",
    answers: [
      {
        text: "Charmed",
        score: ["mystical"]
      },
      {
        text: "Yellowstone",
        score: ["wild"]
      },
      {
        text: "American Horror Story",
        score: ["spooky"]
      }
    ]
  },

  {
    question: "What's your ideal way to spend a day off?",
    answers: [
      {
        text: "At the beach, enjoying the sea and sunshine.",
        score: ["summer"]
      },
      {
        text: "Curling up under a cosy blanket with a hot drink and your fave film.",
        score: ["winter"]
      },
      {
        text: "Dressing up, going somewhere fancy and making an ordinary day feel special.",
        score: ["classics"]
      }
    ]
  },

  {
    question: "Which of these animals do you like more?",
    answers: [
      {
        text: "Cats",
        score: ["mystical"]
      },
      {
        text: "Horses",
        score: ["wild"]
      },
      {
        text: "Crows",
        score: ["spooky"]
      }
    ]
  }

];


// ========================================
// COLLECTION RESULTS
// ========================================

const collections = {

  winter: {
    name: "A Little Winter Magic",
    symbol: "❄️",
    description: "You're a cosy soul who loves life's little comforts. You appreciate warm moments, seasonal magic and artwork that makes a space feel like home.",
    url: "https://wowanothershop.com/collections/a-little-winter-magic"
  },

  summer: {
    name: "The Summer Club",
    symbol: "☀️",
    description: "You're sunshine in human form! Playful, colourful and full of life, you like to have fun and prefer artwork that feels positive and warm.",
    url: "https://wowanothershop.com/collections/the-summer-club"
  },

  classics: {
    name: "The Classics",
    symbol: "💋",
    description: "You have an eye for timeless style. A little glamour, a touch of elegance and a love for the things that never go out of fashion.",
    url: "https://wowanothershop.com/collections/the-classics"
  },

  wild: {
    name: "Wild at Heart",
    symbol: "🤠",
    description: "You have an adventurous spirit and like to do things your own way. You have a rebellious streak and a soft spot for a little wild-west charm.",
    url: "https://wowanothershop.com/collections/wild-at-heart"
  },

  spooky: {
    name: "Spooky Art Lover",
    symbol: "🖤",
    description: "You find comfort in the darker things and you're not afraid to show it. Halloween is like Christmas for you. You like a little mystery, a little mischief and love all things spooky.",
    url: "https://wowanothershop.com/collections/spooky-art-lover"
  },

  mystical: {
    name: "Mystical Muses",
    symbol: "🌙",
    description: "You're imaginative, curious and drawn to a little magic. You've blamed the moon for your problems at least once and love a touch of otherworldly charm.",
    url: "https://wowanothershop.com/collections/mystical-muses"
  }

};


// ========================================
// QUIZ FUNCTIONALITY
// ========================================

let currentQuestion = 0;
let selectedAnswer = null;
let scores = {};


function resetScores() {
  scores = {};

  Object.keys(collections).forEach(key => {
    scores[key] = 0;
  });
}


function startQuiz() {

  resetScores();

  currentQuestion = 0;

  document.getElementById("welcome").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("quiz-section").classList.remove("hidden");

  showQuestion();
}


function showQuestion() {

  selectedAnswer = null;

  const q = questions[currentQuestion];

  document.getElementById("question-number").textContent =
    `QUESTION ${currentQuestion + 1} OF ${questions.length}`;

  document.getElementById("question").textContent = q.question;

  document.getElementById("next").disabled = true;

  document.getElementById("next").textContent =
    currentQuestion === questions.length - 1
      ? "SEE MY MATCH ♥"
      : "NEXT QUESTION →";


  // Progress hearts

  document.getElementById("progress").innerHTML =
    questions.map((_, i) =>
      `<span class="heart ${i <= currentQuestion ? "active" : ""}">♥</span>`
    ).join("");


  // Answer buttons

  const answers = document.getElementById("answers");

  answers.innerHTML = "";

  q.answers.forEach((answer, index) => {

    const button = document.createElement("button");

    button.className = "answer";

    button.textContent = answer.text;

    button.onclick = () => selectAnswer(index);

    answers.appendChild(button);

  });

}


function selectAnswer(index) {

  selectedAnswer = index;

  document.querySelectorAll(".answer").forEach((button, i) => {

    button.classList.toggle("selected", i === index);

  });

  document.getElementById("next").disabled = false;

}


function nextQuestion() {

  if (selectedAnswer === null) return;

  const answer = questions[currentQuestion].answers[selectedAnswer];


  // Primary collection receives two points.

  scores[answer.score[0]] += 2;


  // Secondary collection receives one point.

  const secondary = {
    winter: "mystical",
    summer: "wild",
    classics: "mystical",
    wild: "summer",
    spooky: "mystical",
    mystical: "spooky"
  };

  scores[secondary[answer.score[0]]] += 1;


  currentQuestion++;


  if (currentQuestion < questions.length) {

    showQuestion();

  } else {

    showResult();

  }

}


// ========================================
// DISPLAY FINAL RESULT
// ========================================

function showResult() {

  document.getElementById("quiz-section").classList.add("hidden");

  document.getElementById("result").classList.remove("hidden");


  const maxScore = Math.max(...Object.values(scores));

  const winners = Object.keys(scores).filter(
    key => scores[key] === maxScore
  );


  // Consistent collection order breaks ties.

  const winner = winners[0];

  const collection = collections[winner];


  document.getElementById("result-symbol").textContent =
    collection.symbol;

  document.getElementById("result-title").textContent =
    collection.name;

  document.getElementById("result-description").textContent =
    collection.description;

  document.getElementById("shop-link").href =
    collection.url;

}


// ========================================
// RESTART QUIZ
// ========================================

function restartQuiz() {

  document.getElementById("result").classList.add("hidden");

  document.getElementById("welcome").classList.remove("hidden");

}

</script>

</body>
</html>
